[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ascos-runtime"
version = "0.17.0"
description = "AI Software Company operating-system runtime"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8",
  "ruff>=0.6",
]
browser = [
  "playwright==1.55.0",
]
postgres = [
  "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
include = ["runtime", "runtime.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
exclude = [
  "runtime/composition/container.py",
  "runtime/composition/factory.py",
  "runtime/execution/executor.py",
  "runtime/integrations/git/local_provider.py",
  "runtime/persistence/database/",
  "runtime/persistence/file_store.py",
  "runtime/persistence/postgresql/",
  "runtime/persistence/service.py",
  "runtime/tools/audit.py",
  "runtime/tools/command_runner.py",
  "runtime/transactions/snapshot.py",
  "runtime/workers/lifecycle.py",
  "runtime/workflows/service.py",
]

[[tool.mypy.overrides]]
module = [
  "runtime.composition.container",
  "runtime.composition.factory",
  "runtime.execution.executor",
  "runtime.integrations.git.local_provider",
  "runtime.persistence.file_store",
  "runtime.persistence.service",
  "runtime.tools.command_runner",
  "runtime.transactions.snapshot",
  "runtime.workers.lifecycle",
  "runtime.workflows.service",
]
ignore_errors = true
