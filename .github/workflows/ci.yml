name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m compileall -q runtime tests examples
      - run: python -m ruff check .
      - run: python -m mypy runtime
      - name: Run examples
        shell: bash
        run: |
          for example in examples/*.py; do
            python "$example"
          done
      - run: git diff --check

  optional-postgresql:
    if: ${{ vars.ASCOS_RUN_POSTGRES_TESTS == 'true' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_postgresql_adapter.py
        env:
          ASCOS_POSTGRES_TEST_URL: postgresql://postgres:postgres@localhost:5432/postgres
